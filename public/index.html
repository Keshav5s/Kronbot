<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kronbot 1.0 – Free AI Chatbot powered by Google Gemini</title>
<meta name="description" content="Kronbot is a clean, fast AI chatbot powered by Google Gemini. Ask questions, write code, draft emails and brainstorm ideas with streaming answers on desktop and mobile.">
<meta name="keywords" content="Kronbot, AI chatbot, Gemini chatbot, free AI chat, Google Gemini, AI assistant">
<meta name="author" content="Kronbot">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#000000">
<link rel="canonical" href="https://kronbot.vercel.app/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Kronbot">
<meta property="og:title" content="Kronbot 1.0 – AI Chatbot powered by Google Gemini">
<meta property="og:description" content="A clean black-and-white AI chat experience with streaming answers, markdown, code highlighting and advanced settings.">
<meta property="og:url" content="https://kronbot.vercel.app/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Kronbot 1.0 – AI Chatbot">
<meta name="twitter:description" content="Fast, clean AI chat powered by Google Gemini.">

<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"Kronbot","softwareVersion":"1.0","applicationCategory":"UtilitiesApplication","operatingSystem":"Any","url":"https://kronbot.vercel.app/","description":"AI chatbot powered by Google Gemini.","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Lora:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  // apply saved theme before paint to avoid a flash
  try {
    var s = JSON.parse(localStorage.getItem('kronbot:settings') || '{}');
    var t = s.theme || 'dark';
    if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>
<div class="app">

  <div class="backdrop" id="backdrop"></div>

  <aside class="sidebar" id="sidebar" aria-label="Chat history">
    <div class="sb-top">
      <a class="brand" href="/" aria-label="Kronbot home"><span class="logo">K</span><span class="brand-name">Kronbot</span></a>
      <button class="icon-btn only-mobile" id="closeSidebar" aria-label="Close sidebar">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <button class="new-chat" id="newChat">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat
    </button>
    <nav class="chat-list" id="chatList" aria-label="Previous chats"></nav>
    <div class="sb-bottom">
      <button class="sb-link" id="openSettings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings
      </button>
      <span class="version">Kronbot 1.0</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="openSidebar" aria-label="Open sidebar">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <div class="title">
        <h1>Kronbot</h1><span class="pill">1.0</span>
        <span class="model-label" id="modelLabel">Gemini 2.5 Flash</span>
      </div>
      <button class="icon-btn" id="newChatTop" aria-label="New chat">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>
    </header>

    <section class="scroll" id="scroll" aria-live="polite">
      <div class="thread" id="thread"></div>
    </section>

    <footer class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Message Kronbot" aria-label="Message Kronbot" maxlength="8000"></textarea>
        <button class="send" id="send" aria-label="Send message" disabled>
          <svg class="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          <svg class="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
        </button>
      </div>
      <p class="fineprint">Kronbot 1.0 can make mistakes. Check important information.</p>
    </footer>
  </main>
</div>

<div class="modal" id="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="settingsTitle">Settings</h2>
      <button class="icon-btn" id="closeSettings" aria-label="Close settings"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="sheet-body">

      <h3>Appearance</h3>
      <div class="row"><label>Theme</label>
        <div class="seg" data-key="theme"><button data-v="dark">Dark</button><button data-v="light">Light</button><button data-v="system">System</button></div></div>
      <div class="row"><label for="fontSel">Font</label>
        <select id="fontSel" data-key="font">
          <option value="inter">Inter</option><option value="grotesk">Space Grotesk</option>
          <option value="serif">Lora</option><option value="mono">JetBrains Mono</option>
        </select></div>
      <div class="row"><label>Text size</label>
        <div class="seg" data-key="fontSize"><button data-v="14">Small</button><button data-v="16">Medium</button><button data-v="18">Large</button></div></div>
      <div class="row"><label>Typing animation</label>
        <div class="seg" data-key="typing"><button data-v="instant">Off</button><button data-v="fast">Fast</button><button data-v="normal">Normal</button><button data-v="slow">Slow</button></div></div>

      <h3>Model</h3>
      <div class="row"><label for="modelSel">Model</label>
        <select id="modelSel" data-key="model">
          <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
          <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
        </select></div>
      <div class="row col"><label for="tempRange">Creativity <output id="tempOut">0.7</output></label>
        <input type="range" id="tempRange" min="0" max="2" step="0.1"><small>Lower is more precise, higher is more creative.</small></div>
      <div class="row col"><label for="tokRange">Max reply length <output id="tokOut">2048</output> tokens</label>
        <input type="range" id="tokRange" min="256" max="8192" step="256"></div>
      <div class="row col"><label for="sysPrompt">Custom instructions</label>
        <textarea id="sysPrompt" rows="3" maxlength="2000" placeholder="e.g. Keep answers short and use simple English."></textarea></div>

      <h3>Data</h3>
      <div class="row"><label>Chats are stored only in this browser.</label>
        <div class="btns"><button class="btn" id="exportChats">Export</button><button class="btn danger" id="clearChats">Delete all</button></div></div>
      <div class="row"><label>Reset settings</label><div class="btns"><button class="btn" id="resetSettings">Reset</button></div></div>

      <p class="about">Kronbot 1.0 · Powered by Google Gemini</p>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<noscript><p style="padding:2rem;font-family:sans-serif">Kronbot is an AI chatbot powered by Google Gemini. Please enable JavaScript to chat.</p></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="app.js"></script>
</body>
  </html>
